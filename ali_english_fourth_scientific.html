function mkOptions(correct, pool, arMap={}){const opts=[correct,...pool.filter(x=>x!==correct).slice(0,3)];return shuffle(opts).map(x=>({en:x,ar:arMap[x]||''}));}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function qObj(prompt,trans,correct,opts,explain,source){const raw=opts.map(x=>typeof x==='string'?{en:x,ar:''}:x);const unique=raw.filter((x,i)=>raw.findIndex(y=>y.en===x.en)===i);const correctOpt=unique.find(x=>x.en===correct);const rest=unique.filter(x=>x.en!==correct);const o=shuffle([...(correctOpt?[correctOpt]:[]),...rest].slice(0,4));return {prompt,translation:trans,options:o,correct:o.findIndex(x=>x.en===correct),explain,source};}

function buildAbbr(){return abbreviations.map((d,i)=>{const q=qObj('ماذا تعني الكلمة المختصرة ('+d[1]+')؟','اختر معنى الاختصار.',d[0],[d[0],...shuffle(abbreviations.map(x=>x[0]).filter(x=>x!==d[0])).slice(0,3)],d[0]+' = '+d[1]+' ('+d[2]+')',src(i+1,'Activity Book','18'));q.translation=d[2];return q;});}
function buildCountries(){return countries.map((d,i)=>{const q=qObj('ما اللغة المذكورة أمام الدولة ('+d[0]+')؟','اختر اللغة المذكورة لهذه الدولة في التمرين.',d[1],[d[1],...shuffle(countries.map(x=>x[1]).filter(x=>x!==d[1])).slice(0,3)],d[0]+' = '+d[1]+' ('+d[2]+' = '+d[3]+')',src(i+1,'Activity Book – Exercise 1','20'));q.translation=d[2];q.answerTranslation=d[3];return q;});}
function buildLiterature(){return literature.map((d,i)=>{const q=qObj(d[0],d[1],d[2],[d[2],...shuffle(literature.map(x=>x[2]).filter(x=>x!==d[2])).slice(0,3)],'الإجابة من النص الظاهر في الصورة.',src(i+1,'الأدب – القسم الأول، تمرين صفحة 128','128؛ مرجع كتاب النشاط الذي حدده الطالب: ص148'));q.answerTranslation=d[3];return q;});}
function buildIrregular(kind){const allV2=['was','were','became','brought','bought','came','did','ate','felt','found','flew','forgot','got','gave','went','had'];const allV3=[...new Set(irregular.map(x=>x[2]))];let qs=[];irregular.forEach((v,i)=>{if(kind==='v1v2'||kind==='random'){if(v[0]==='be'){[['I / He / She / It','was'],['You / We / They','were']].forEach((z,j)=>qs.push(qObj('اختر V2 من الفعل (be) مع '+z[0]+'.','حوّل be إلى الماضي حسب الضمير.',z[1],allV2,'be مع '+z[0]+' يأخذ '+z[1]+'.',src(i+1,'قائمة الأفعال الشاذة – V1 → V2'))));}else qs.push(qObj('ما الماضي البسيط V2 للفعل ('+v[0]+')؟','حوّل الفعل من V1 إلى V2.',v[1],[v[1],...shuffle(allV2.filter(x=>x!==v[1])).slice(0,3)],v[0]+' → '+v[1]+' → '+v[2],src(i+1,'قائمة الأفعال الشاذة – V1 → V2')));}
 if(kind==='v2v3'||kind==='random')qs.push(qObj('ما التصريف الثالث V3 للفعل الماضي ('+v[1]+')؟','حوّل من V2 إلى V3.',v[2],[v[2],...shuffle(allV3.filter(x=>x!==v[2])).slice(0,3)],v[0]+' → '+v[1]+' → '+v[2],src(i+1,'قائمة الأفعال الشاذة – V2 → V3')));
 if(kind==='v1v3'||kind==='random')qs.push(qObj('ما التصريف الثالث V3 للفعل ('+v[0]+')؟','حوّل من V1 إلى V3.',v[2],[v[2],...shuffle(allV3.filter(x=>x!==v[2])).slice(0,3)],v[0]+' → '+v[1]+' → '+v[2],src(i+1,'قائمة الأفعال الشاذة – V1 → V3')));
 });return kind==='random'?shuffle(qs):qs;}
function buildOld(){return oldQuiz.map((d,i)=>{const opts=d[4].map(x=>({en:x[0],ar:x[1]}));const q=qObj(d[0],d[1],d[2],opts,d[3],src(i+1,'اختبار اللغات السابق – محفوظ من النسخة السابقة','غير محددة'));q.answerTranslation=d[3];if(i===7)q.note={ar:'تنبيه: الترجمة العربية المطبوعة في الورقة تظهر «القرن التاسع عشر»، بينما النص الإنجليزي يقول 9th century أي القرن التاسع. نعتمد النص الإنجليزي في صياغة السؤال.',en:'Note: the printed Arabic translation on the sheet says “the nineteenth century”, while the English text says “9th century”. The question follows the English wording.'};return q;});}
const grammarModules=[['ps','📗','المضارع البسيط – Present Simple','شرح الإثبات والنفي والسؤال والكلمات الدالة',buildGrammarSimple],['pc','📘','المضارع المستمر – Present Continuous','شرح am / is / are + V-ing والكلمات الدالة',buildGrammarContinuous],['diag','🔍','تمييز الزمن والدليل – خطوتان','حدد الزمن أولاً ثم اختر الدليل من الجملة',buildDiagnostic],['ing','🎨','الصفات ING وED وBecause','متى نصف الشيء ومتى نصف شعور الشخص؟',buildIngQuiz],['exa','📝','تمرين A – صفحة 6','Activity Book – Present Continuous',()=>buildExercise(exA,'Exercise A','6')],['exd','📝','تمرين D – صفحة 9','Activity Book – ING / ED',()=>buildExercise(exD,'Exercise D','9')],['exam','🎯','أسئلة امتحانية على ING وED','تدريب على الاختيار حسب معنى الجملة',buildExamIng]];

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setLanguage(l){locale=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.body.classList.toggle('en',l==='en');el('siteTitle').textContent=t().title;el('siteSub').textContent=t().sub;el('siteFooter').textContent=l==='ar'?'من تصنيع علي حسين · الرابع العلمي – منهج العراق':'Made by Ali Hussein · Fourth Scientific – Iraq Curriculum';el('arBtn').classList.toggle('active',l==='ar');el('enBtn').classList.toggle('active',l==='en');render();}

function translateDesc(id){return ({ps:'Affirmative, negative, questions and signal words',pc:'am / is / are + V-ing and signal words',diag:'Identify the tense, then choose the clue in the sentence',ing:'When to use ING and ED adjectives; the meaning of Because',exa:'Activity Book – Present Continuous',exd:'Activity Book – ING / ED adjectives',exam:'Choose the correct ING or ED adjective',syn:'11 synonym pairs from the supplied lists',ant:'5 opposite pairs from Unit 1',abbr:'Activity Book page 18',countries:'Activity Book page 20 – Exercise 1'})[id]||'';}
function translateModule(id){return ({ps:'Present Simple',pc:'Present Continuous',diag:'Tense & Clue – Two Steps',ing:'ING/ED Adjectives and Because',exa:'Exercise A – Page 6',exd:'Exercise D – Page 9',exam:'Exam Practice – ING and ED',syn:'Synonyms',ant:'Antonyms',abbr:'Abbreviations – Activity Book p.18',countries:'Countries & Official Languages'})[id]||id;}
function getModule(id){return [...grammarModules,...vocabModules].find(x=>x[0]===id);}
function renderModuleDetail(){const m=getModule(moduleId);if(!m)return '';const title=isAr()?m[2]:translateModule(moduleId);const desc=m[3];let html='';if(moduleId==='ps')html=reviewPS();if(moduleId==='pc')html=reviewPC();if(moduleId==='diag')html=reviewDiag();if(moduleId==='ing')html=reviewIng();if(moduleId==='exa')html=reviewExercise(exA,'Exercise A','6');if(moduleId==='exd')html=reviewExercise(exD,'Exercise D','9');if(moduleId==='exam')html=reviewExercise(ingExam,'Exam Practice – ING/ED','غير محددة');if(moduleId==='syn')html=reviewPairs(synonyms,'syn');if(moduleId==='ant')html=reviewPairs(antonyms,'ant');if(moduleId==='abbr')html=reviewPairs(abbreviations,'abbr');if(moduleId==='countries')html=reviewPairs(countries,'countries');return crumb(title)+`<section class="panel"><h2>${title}</h2><p class="desc">${isAr()?desc:translateDesc(moduleId)}</p><div class="actionrow"><button class="btn soft" data-action="back-grid">${t().back}</button><button class="btn soft" data-action="review">📖 ${t().study}</button><button class="btn primary" data-action="start-module">🎯 ${t().test}</button></div><div class="rulebox" style="margin-top:17px"><h4>${isAr()?'مراجعة سريعة':'Quick review'}</h4>${html}</div></section>`;}
function reviewPS(){return `<div class="rulebox"><h4>1- ${isAr()?'الإثبات':'Affirmative'}</h4><span class="formula">I / You / We / They + V1</span><span class="formula">He / She / It + V1 + s / es</span></div><div class="rulebox"><h4>2- ${isAr()?'النفي':'Negative'}</h4><span class="formula">I / You / We / They + don't + V1</span><span class="formula">He / She / It + doesn't + V1</span></div><div class="rulebox"><h4>3- ${isAr()?'السؤال':'Question'}</h4><span class="formula">Do + I / You / We / They + V1?</span><span class="formula">Does + He / She / It + V1?</span></div><div class="rulebox"><h4>${isAr()?'الكلمات الدالة':'Signal words'}</h4>Always = دائماً · Usually = عادةً · Often = غالباً · Sometimes = أحياناً · Never = أبداً · Every day = كل يوم · Every week = كل أسبوع</div>${renderExampleList(psExamples)}`;}

function reviewDiag(){return `<div class="rulebox"><h4>${isAr()?'الخطوة الأولى: حدّد الزمن':'Step 1: Identify the tense'}</h4>${isAr()?'اختر Present Simple أو Present Continuous بناءً على معنى الجملة وتركيبها.':'Choose Present Simple or Present Continuous from the meaning and structure.'}</div><div class="rulebox"><h4>${isAr()?'الخطوة الثانية: حدّد الدليل':'Step 2: Find the clue'}</h4>${isAr()?'اختر الدليل الموجود فعلاً في الجملة: Every day / Every Friday / now / at the moment / s-es / doesn’t + V1 / is-are + V-ing.':'Select the clue actually found in the sentence.'}</div>`;}
function reviewIng(){return `<div class="rulebox"><h4>ING</h4>${isAr()?'نستخدم ING عندما تصف الصفة الشيء الذي يسبب الشعور.':'Use ING when the adjective describes the thing that causes the feeling.'}</div><div class="rulebox"><h4>ED</h4>${isAr()?'نستخدم ED عندما تصف الصفة شعور الشخص.':'Use ED when the adjective describes how a person feels.'}</div><div class="note"><b>Because</b> = ${isAr()?'لأن. لا تحدد وحدها هل نختار ING أو ED؛ نختار حسب معنى الجملة.':'because. It does not decide ING or ED by itself; choose from the meaning of the sentence.'}</div>`+renderExampleList([['The film was (bored / boring).','boring','الفيلم يسبب الشعور.'],['The lesson is (interested / interesting).','interesting','الدرس يسبب الشعور.'],['My brother was (exciting / excited) because he won the game.','excited','الشخص يشعر بالحماس.'],["I was (embarrassing / embarrassed) because I didn't know anyone.",'embarrassed','الشخص يشعر بالإحراج.'],['I was (tiring / tired) because I worked all day.','tired','الشخص يشعر بالتعب.'],['The journey was (tiring / tired) because it was very long.','tiring','الرحلة تسبب التعب.']]);}

function renderReview(){const m=getModule(moduleId);let html='';if(m){if(moduleId==='ps')html=reviewPS();else if(moduleId==='pc')html=reviewPC();else if(moduleId==='diag')html=reviewDiag();else if(moduleId==='ing')html=reviewIng();else if(moduleId==='exa')html=reviewExercise(exA,'Exercise A','6');else if(moduleId==='exd')html=reviewExercise(exD,'Exercise D','9');else if(moduleId==='exam')html=reviewExercise(ingExam,'Exam practice','غير محددة');else if(moduleId==='syn')html=reviewPairs(synonyms,'syn');else if(moduleId==='ant')html=reviewPairs(antonyms,'ant');else if(moduleId==='abbr')html=reviewPairs(abbreviations,'abbr');else if(moduleId==='countries')html=reviewPairs(countries,'countries');}
 if(reviewFrom==='lit')html=literature.map((d,i)=>`<div class="reviewcard"><span class="tag">${i+1}</span><div class="enline">${esc(d[0])}</div><p>${esc(d[1])}</p><div class="enline">${esc(d[2])}</div><p>${esc(d[3])}</p><div class="source">${isAr()?'الأدب – القسم الأول، تمرين ص128 · مرجع كتاب النشاط الذي حدده الطالب: ص148':'Literature – Section One, exercise p.128 · Activity Book reference supplied by the student: p.148'}</div></div>`).join('');

 if(reviewFrom==='old')html=oldQuiz.map((d,i)=>`<div class="reviewcard"><span class="tag">${i+1}</span><div class="enline">${d[0]}</div><p>${d[1]}</p><bdi dir="ltr">${d[2]}</bdi><p>${d[3]}</p>${i===7?`<div class="note">${isAr()?'تنبيه: الترجمة العربية المطبوعة في الورقة تظهر «القرن التاسع عشر»، بينما النص الإنجليزي يقول 9th century أي القرن التاسع. نعتمد النص الإنجليزي في صياغة السؤال.':'Note: the printed Arabic translation says “the nineteenth century”, while the English text says “9th century”. The question follows the English wording.'}</div>`:''}<div class="source">${isAr()?'السؤال محفوظ من اختبار اللغات السابق':'Preserved from the previous languages quiz'} · ${d[4].map(x=>esc(x[0])).join(' / ')}</div></div>`).join('');

function triggerFrame(ok){frameReset();el('flashframe').classList.add(ok?'good':'bad');frameTimer=setTimeout(()=>el('flashframe').className='flashframe',2500);}
function hasAnswer(){return answers[qi]&&answers[qi][step]!==undefined;}
function displaySource(name){if(isAr())return name;return name.replace('الملخص المرسل من الطالب','student-provided summary').replace('قائمة المترادفات','synonym list').replace('قائمة المعاكسات','antonym list').replace('صفات ING وED','ING/ED adjectives').replace('قاعدة المضارع البسيط','Present Simple rule').replace('قاعدة المضارع المستمر','Present Continuous rule').replace('تمييز المضارع البسيط والمستمر','Present Simple vs Present Continuous').replace('قائمة الأفعال الشاذة','irregular verbs list').replace('الأدب – القسم الأول، تمرين صفحة 128','Literature – Section One, exercise page 128').replace('اختبار اللغات السابق – محفوظ من النسخة السابقة','previous languages quiz – preserved from earlier version').replace('الصورة الثانية – الصفحة غير ظاهرة','second supplied image – page not visible').replace('كتاب النشاط ص23 – تمرين C','Activity Book p.23 – Exercise C').replace('كتاب النشاط','Activity Book').replace('الصورة الثانية','second supplied image').replace('قائمة الاختصارات','abbreviation list');}
function displayPage(page){if(isAr())return page;if(page==='غير محددة')return 'not specified';if(String(page).includes('مرجع كتاب النشاط الذي حدده الطالب'))return '128; Activity Book reference supplied by the student: p.148';return String(page).replace('؛ مرجع كتاب النشاط الذي حدده الطالب: ص','; Activity Book reference supplied by the student: p.').replace('كتاب النشاط ص','Activity Book p.').replace('صفحة ','page ');}
function explainEN(q){if(moduleId==='ps')return 'Use the present simple form shown in the rule: add s/es with he, she or it; use the base verb after do/does and don’t/doesn’t.';if(moduleId==='pc')return 'Use am/is/are + the verb ending in -ing; match the auxiliary to the subject.';if(moduleId==='diag')return 'The tense is identified from the signal word or verb structure shown in the sentence.';if(moduleId==='ing'||moduleId==='exam')return 'ING describes the thing causing the feeling; ED describes how a person feels. Because alone does not decide the form.';if(moduleId==='exa'||moduleId==='exd')return 'This is the completed form shown in the supplied Activity Book exercise.';if(moduleId==='syn')return 'This is the matching synonym in the supplied vocabulary list.';if(moduleId==='ant')return 'This is the opposite listed in the supplied vocabulary list.';if(moduleId==='abbr')return 'This is the full word paired with the abbreviation in the supplied list.';if(moduleId==='countries')return 'This is the language paired with the country in Activity Book Exercise 1.';if(root==='quiz'&&quizFrom==='lit')return 'This answer is taken from the supplied Literature – Section One image.';if(quizFrom==='irr')return 'This is the corresponding form shown in the supplied irregular verbs list.';if(quizFrom==='old')return 'This answer is preserved from the previous language quiz.';return 'This answer matches the information in the supplied study material.';}

function promptForDisplay(prompt,q,part){
 if(isAr())return prompt;
 if(q.twoStep)return part===q.twoStep[0]?t().tense:t().clue;
 if(moduleId==='syn'){const m=prompt.match(/\((.*?)\)/);return `What is a synonym for (${m?m[1]:''})?`;}
 if(moduleId==='ant'){const m=prompt.match(/\((.*?)\)/);return `What is the opposite of (${m?m[1]:''})?`;}
 if(moduleId==='abbr'){const m=prompt.match(/\((.*?)\)/);return `What does the abbreviation (${m?m[1]:''}) mean?`;}
 if(moduleId==='countries'){const m=prompt.match(/\((.*?)\)/);return `Which language is listed for (${m?m[1]:''})?`;}
 if(quizFrom==='irr'){
  let m=prompt.match(/\((.*?)\)/); const v=m?m[1]:'';
  if(prompt.includes('مع '))return `Choose the V2 form of (be) with ${prompt.split('مع ')[1].replace('.','')}.`;
  if(prompt.includes('V2 للفعل'))return `What is the V2 past form of (${v})?`;
  if(prompt.includes('الماضي'))return `What is the V3 past participle of (${v})?`;
  if(prompt.includes('V3 للفعل'))return `What is the V3 past participle of (${v})?`;
 }
 return prompt;
}

function renderQuiz(){const q=quiz[qi];if(!q)return '';let stage=q.twoStep?step:0;let part=q.twoStep?q.twoStep[stage]:null;let prompt=part?part.prompt:q.prompt;let displayPrompt=promptForDisplay(prompt,q,part);let opts=part?part.options.map(x=>({en:x,ar:''})):q.options;let ans=hasAnswer();let chosen=ans?answers[qi][stage]:undefined;let correct=q.twoStep?part.correct:q.options[q.correct].en;let ok=ans&&(chosen===correct);let explain=part?part.explain:q.explain;let total=quiz.length;let chosenObj=opts.find(x=>x.en===chosen);let correctObj=q.twoStep?{en:correct,ar:''}:q.options[q.correct];let indexSource=q.source||src(qi+1,'المحتوى المرسل');let trVisible=trUserChoice===null?locale==='ar':trUserChoice;
 return `<div class="quizbox"><div class="qhead"><span>${t().progress} ${qi+1} / ${total}${q.twoStep?' · '+(stage===0?t().stage1:t().stage2):''}</span><span>${t().score}: ${answers.filter((a,i)=>a&&(quiz[i].twoStep?a.length===2&&a.every((x,j)=>x===quiz[i].twoStep[j].correct):a[0]===quiz[i].options[quiz[i].correct]?.en)).length}</span></div><div class="progress"><span style="width:${Math.round((qi/total)*100)}%"></span></div><section class="qcard"><p class="qprompt">${isAr()?esc(prompt):`<span class="qen">${esc(displayPrompt)}</span>`}</p><div class="options">${opts.map((o,i)=>{let isCorrect=ans&&o.en===correct;let isWrong=ans&&chosen===o.en&&!isCorrect;return `<button class="option ${isCorrect?'correct':''} ${isWrong?'wrong':''}" ${ans?'disabled':''} data-choice="${i}">${esc(o.en)} ${isCorrect&&ans?' ✓':''}</button>`;}).join('')}</div><div id="feedback" class="feedback ${ans?'show '+(ok?'good':'bad'):''}">${ans?(ok?t().correct:t().wrong)+`<div class="explain">${t().answer} <bdi dir="ltr">${esc(correct)}</bdi><br>${t().why} ${esc(isAr()?explain:explainEN(q))}</div><div class="meta">${t().point} ${indexSource.point} · ${t().source} ${esc(displaySource(indexSource.source))} · ${t().page} ${esc(displayPage(indexSource.page))}</div>`:''}</div><div id="translation" class="translation ${ans&&trVisible?'show':''}"><h4>${t().trTitle}</h4><p>${t().question}: ${esc(q.translation|| (isAr()?'لا توجد ترجمة عربية مذكورة لهذا السؤال في الملخص المرسل.':'No Arabic translation for this question was included in the supplied notes.'))}</p><p>${t().answer} <bdi dir="ltr">${esc(correct)}</bdi>${q.answerTranslation?' · '+esc(q.answerTranslation):''}</p>${q.note?`<div class="note">${esc(isAr()?q.note.ar:q.note.en)}</div>`:''}</div><div class="nextrow">${ans?`<button class="btn small soft" data-action="toggle-translation">${trVisible?t().hideTr:t().showTr}</button>`:`<span class="meta">${t().choose}</span>`}${ans?`<button class="btn primary" data-action="next">${q.twoStep&&stage===0?t().stage2:qi===quiz.length-1?t().finish:t().next}</button>`:''}</div></section><div class="quizfooter"><button class="btn" data-action="quiz-back">${t().back}</button><button class="btn" data-action="previous" ${qi===0&&step===0?'disabled':''}>${t().prev}</button><span class="meta">${qi+1} / ${total}</span></div></div>`;}
function renderResult(){let correct=answers.reduce((s,a,i)=>s+(a&&(quiz[i].twoStep?a.length===2&&a.every((x,j)=>x===quiz[i].twoStep[j].correct):a[0]===quiz[i].options[quiz[i].correct]?.en)?1:0),0);let wrong=quiz.length-correct;return crumb(t().result)+`<section class="panel"><h2>${t().allDone}</h2><div class="stats"><div class="stat"><strong>${correct}</strong><span>${t().score}</span></div><div class="stat"><strong>${wrong}</strong><span>${t().mistakes}</span></div><div class="stat"><strong>${Math.round(correct/quiz.length*100)}%</strong><span>${t().result}</span></div></div><div class="actionrow"><button class="btn primary" data-action="retry">${t().retry}</button><button class="btn" data-action="home">${t().home}</button></div><div class="reviewlist" style="margin-top:18px">${quiz.map((q,i)=>{let a=answers[i];let corr=q.twoStep?q.twoStep.every((p,j)=>a?.[j]===p.correct):a?.[0]===q.options[q.correct]?.en;return `<div class="reviewcard"><h4>${i+1}. ${esc(q.prompt)}</h4><p>${corr?'✅':'❌'} ${q.twoStep?'':t().yourAnswer+' '+esc(a?.[0]||'—')+' · '+t().answer+' '+esc(q.options[q.correct]?.en||'')}</p><div class="source">${t().point} ${q.source.point} · ${t().source} ${esc(displaySource(q.source.source))} · ${t().page} ${esc(displayPage(q.source.page))}</div></div>`;}).join('')}</div></section>`;}
function render(){const app=el('app');if(root==='quiz'){app.innerHTML=renderQuiz();wireOptions();return;}if(root==='result'){app.innerHTML=renderResult();return;}if(!root){app.innerHTML=renderHome();return;}if(root==='grammar'||root==='vocab'){app.innerHTML=renderModuleGrid(root);return;}if(root==='module'){app.innerHTML=renderModuleDetail();return;}if(root==='review'){app.innerHTML=renderReview();return;}if(root==='lit'){app.innerHTML=renderLiterature();return;}if(root==='irr'){app.innerHTML=renderIrregular();return;}if(root==='old'){app.innerHTML=renderOld();return;}}
function wireOptions(){document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(hasAnswer())return;const q=quiz[qi],n=Number(b.dataset.choice),stage=q.twoStep?step:0;let opts=q.twoStep?q.twoStep[stage].options.map(x=>({en:x})):q.options;let correct=q.twoStep?q.twoStep[stage].correct:q.options[q.correct].en;const value=opts[n].en;const wasCorrect=value===correct;answers[qi]=answers[qi]||[];answers[qi][stage]=value;if(q.twoStep)answers[qi][stage]=value;triggerFrame(wasCorrect);render();}));}
function bind(){document.querySelectorAll('[data-root]').forEach(b=>b.onclick=()=>{root=b.dataset.root;moduleId=null;reviewFrom=null;render();});document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{moduleId=b.dataset.module;root='module';render();});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='home'){home();return;}if(a==='review'){reviewFrom=root;root='review';render();return;}if(a==='back-module'||a==='back-grid'){root=moduleId?(moduleId==='syn'||moduleId==='ant'||moduleId==='abbr'||moduleId==='countries'?'vocab':'grammar'):(reviewFrom||'home');render();return;}if(a==='start-module'){startQuiz();return;}if(a==='quiz-back'){root=quizFrom==='module'?'module':(quizFrom||'home');render();return;}if(a==='toggle-translation'){trUserChoice=!(trUserChoice===null?locale==='ar':trUserChoice);render();return;}if(a==='next'){const q=quiz[qi];if(q.twoStep&&step===0){step=1;frameReset();render();return;}frameReset();if(qi===quiz.length-1){root='result';render();}else{qi++;step=0;render();}return;}if(a==='previous'){frameReset();if(quiz[qi].twoStep&&step===1){step=0;render();return;}qi=Math.max(0,qi-1);step=quiz[qi]?.twoStep&&answers[qi]?.[1]!==undefined?1:0;trUserChoice=null;render();return;}if(a==='retry'){startQuiz();return;}});document.querySelectorAll('[data-ir-mode]').forEach(b=>b.onclick=()=>startQuiz(buildIrregular(b.dataset.irMode)));}
// Bind handlers after every render; no delegated duplicate handlers.
const originalRender=render;render=function(){originalRender();bind();};render();
</script></body></html>
